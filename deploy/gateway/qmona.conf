# Qmona site config for the server's shared reverse proxy (nginx, one file per project in its conf.d/ folder).
# Install as <gateway-dir>/conf.d/qmona.conf, then apply with the gateway's reload script (it runs `nginx -t` first).
#
# Routing:  qmona.com, www.qmona.com  -> qmona-frontend:3000  (Next.js website + /admin)
#           api.qmona.com             -> qmona-backend:4000   (REST API + uploaded images under /media)
#
# Upstreams use a variable + the gateway's resolver, so a stopped Qmona can never stop nginx from starting or
# reloading for the other sites. TLS uses a Cloudflare Origin Certificate stored in the gateway's ssl directory as
# qmona.fullchain.pem / qmona.privkey.pem (Cloudflare SSL mode: Full (strict)).

server {
    listen 80;
    server_name qmona.com www.qmona.com api.qmona.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- Website ---------------------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name qmona.com www.qmona.com;

    ssl_certificate     /etc/nginx/ssl/qmona.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/qmona.privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;   # image uploads go through the website's /api/v1 proxy

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Next.js on-demand revalidation is internal only (the API calls the website container directly).
    location = /api/revalidate { return 404; }

    location / {
        set $qmona_web http://qmona-frontend:3000;
        proxy_pass $qmona_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Cloudflare puts the real visitor address in CF-Connecting-IP; the API uses X-Forwarded-For for rate limits.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# --- API and uploaded images -----------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name api.qmona.com;

    ssl_certificate     /etc/nginx/ssl/qmona.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/qmona.privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;   # MEDIA_MAX_UPLOAD_MB (10) + form overhead

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        set $qmona_api http://qmona-backend:4000;
        proxy_pass $qmona_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
